  <script>
    document.documentElement.classList.add("js");

  <style>
    :root {
      color-scheme: dark;
      --night-950: #03060f;
      --night-900: #050914;
      --night-800: #091224;
      --night-700: #111c34;
      --cream: #f3e7d4;
      --cream-soft: #d8c9b9;
      --cream-muted: #aa9d9b;
      --rose: #e2a6ad;
      --rose-bright: #ffd1d1;
      --lavender: #b8a9e8;
      --lavender-bright: #ddd3ff;
      --gold: #efd0a2;
      --line: rgba(239, 208, 162, 0.2);
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
      --sans: "Avenir Next", "Segoe UI Variable", "Segoe UI", Helvetica, Arial, sans-serif;
      --pointer-x: 0px;
      --pointer-y: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      min-height: 100%;
      background: var(--night-950);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--night-950);
      color: var(--cream);
      font-family: var(--sans);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
    }

    :focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
    }

    ::selection {
      color: var(--night-950);
      background: var(--rose-bright);
    }

    .skip-link {
      position: fixed;
      left: 1rem;
      top: 1rem;
      z-index: 30;
      padding: 0.72rem 0.9rem;
      border-radius: 4px;
      background: var(--cream);
      color: var(--night-950);
      font-size: 0.86rem;
      font-weight: 700;
      text-decoration: none;
      transform: translateY(-180%);
      transition: transform 160ms ease;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .experience {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 71% 45%, rgba(112, 76, 139, 0.16), transparent 32%),
        radial-gradient(ellipse at 27% 75%, rgba(36, 92, 107, 0.1), transparent 34%),
        linear-gradient(145deg, var(--night-900) 0%, var(--night-950) 48%, #070b17 100%);
    }

    .experience::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 7;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(3, 6, 15, 0.08) 48%, rgba(3, 6, 15, 0.58) 100%),
        radial-gradient(ellipse at center, transparent 45%, rgba(2, 4, 10, 0.55) 100%);
    }

    .experience::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.012) 0,
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px,
          transparent 4px
        );
      mix-blend-mode: soft-light;
    }

    .ambient {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .star-field {
      position: absolute;
      inset: -5%;
      transform: translate3d(
        calc(var(--pointer-x) * var(--parallax, 0)),
        calc(var(--pointer-y) * var(--parallax, 0)),
        0
      );
      transition: transform 700ms cubic-bezier(0.2, 0.75, 0.25, 1);
      will-change: transform;
    }

    .star-field::before,
    .star-field::after {
      content: "";
      position: absolute;
      inset: -15%;
      background-repeat: no-repeat;
    }

    .star-field--far {
      --parallax: -0.12;
      opacity: 0.72;
    }

    .star-field--far::before {
      background-image:
        radial-gradient(circle at 4% 18%, rgba(243, 231, 212, 0.7) 0 1px, transparent 1.4px),
        radial-gradient(circle at 9% 67%, rgba(184, 169, 232, 0.48) 0 0.8px, transparent 1.3px),
        radial-gradient(circle at 15% 33%, rgba(243, 231, 212, 0.58) 0 1px, transparent 1.5px),
        radial-gradient(circle at 21% 82%, rgba(226, 166, 173, 0.5) 0 0.8px, transparent 1.3px),
        radial-gradient(circle at 29% 12%, rgba(243, 231, 212, 0.62) 0 1px, transparent 1.4px),
        radial-gradient(circle at 35% 48%, rgba(184, 169, 232, 0.48) 0 0.8px, transparent 1.3px),
        radial-gradient(circle at 42% 74%, rgba(243, 231, 212, 0.54) 0 1px, transparent 1.4px),
        radial-gradient(circle at 51% 21%, rgba(226, 166, 173, 0.48) 0 0.8px, transparent 1.3px),
        radial-gradient(circle at 58% 58%, rgba(243, 231, 212, 0.66) 0 1.1px, transparent 1.6px),
        radial-gradient(circle at 67% 37%, rgba(184, 169, 232, 0.54) 0 0.8px, transparent 1.3px),
        radial-gradient(circle at 74% 88%, rgba(243, 231, 212, 0.62) 0 1px, transparent 1.4px),
        radial-gradient(circle at 82% 16%, rgba(226, 166, 173, 0.46) 0 0.8px, transparent 1.3px),
        radial-gradient(circle at 89% 62%, rgba(243, 231, 212, 0.62) 0 1px, transparent 1.4px),
        radial-gradient(circle at 96% 36%, rgba(184, 169, 232, 0.48) 0 0.8px, transparent 1.3px);
      animation: starDriftFar 34s linear infinite;
    }

    .star-field--far::after {
      opacity: 0.55;
      transform: translate(7%, 4%);
      background-image:
        radial-gradient(circle at 7% 43%, rgba(243, 231, 212, 0.38) 0 0.7px, transparent 1.2px),
        radial-gradient(circle at 18% 9%, rgba(226, 166, 173, 0.34) 0 0.7px, transparent 1.2px),
        radial-gradient(circle at 31% 62%, rgba(243, 231, 212, 0.38) 0 0.7px, transparent 1.2px),
        radial-gradient(circle at 47% 34%, rgba(184, 169, 232, 0.34) 0 0.7px, transparent 1.2px),
        radial-gradient(circle at 63% 8%, rgba(243, 231, 212, 0.38) 0 0.7px, transparent 1.2px),
        radial-gradient(circle at 76% 51%, rgba(226, 166, 173, 0.34) 0 0.7px, transparent 1.2px),
        radial-gradient(circle at 92% 79%, rgba(243, 231, 212, 0.38) 0 0.7px, transparent 1.2px);
      animation: starDriftFarTwo 46s linear infinite;
    }

    .star-field--mid {
      --parallax: 0.24;
      opacity: 0.86;
    }

    .star-field--mid::before {
      background-image:
        radial-gradient(circle at 2% 53%, rgba(255, 248, 235, 0.84) 0 1.3px, transparent 2px),
        radial-gradient(circle at 12% 22%, rgba(221, 211, 255, 0.72) 0 1px, transparent 1.7px),
        radial-gradient(circle at 24% 91%, rgba(255, 209, 209, 0.7) 0 1.2px, transparent 1.8px),
        radial-gradient(circle at 36% 28%, rgba(255, 248, 235, 0.64) 0 1px, transparent 1.6px),
        radial-gradient(circle at 48% 64%, rgba(221, 211, 255, 0.68) 0 1.1px, transparent 1.8px),
        radial-gradient(circle at 61% 18%, rgba(255, 248, 235, 0.88) 0 1.5px, transparent 2.2px),
        radial-gradient(circle at 72% 72%, rgba(255, 209, 209, 0.62) 0 1px, transparent 1.7px),
        radial-gradient(circle at 84% 41%, rgba(255, 248, 235, 0.76) 0 1.2px, transparent 1.9px),
        radial-gradient(circle at 95% 85%, rgba(221, 211, 255, 0.62) 0 1px, transparent 1.7px);
      animation: starDriftMid 24s ease-in-out infinite alternate;
    }

    .star-field--mid::after {
      opacity: 0.62;
      transform: translate(-6%, 7%);
      background-image:
        radial-gradient(circle at 6% 29%, rgba(255, 248, 235, 0.64) 0 1px, transparent 1.6px),
        radial-gradient(circle at 17% 76%, rgba(221, 211, 255, 0.54) 0 0.9px, transparent 1.5px),
        radial-gradient(circle at 29% 11%, rgba(255, 209, 209, 0.54) 0 0.9px, transparent 1.5px),
        radial-gradient(circle at 43% 87%, rgba(255, 248, 235, 0.62) 0 1px, transparent 1.6px),
        radial-gradient(circle at 55% 42%, rgba(221, 211, 255, 0.56) 0 0.9px, transparent 1.5px),
        radial-gradient(circle at 68% 93%, rgba(255, 248, 235, 0.58) 0 1px, transparent 1.6px),
        radial-gradient(circle at 79% 25%, rgba(255, 209, 209, 0.5) 0 0.9px, transparent 1.5px),
        radial-gradient(circle at 93% 57%, rgba(255, 248, 235, 0.64) 0 1px, transparent 1.6px);
      animation: starPulse 6.8s ease-in-out infinite;
    }

    .star-field--near {
      --parallax: 0.48;
      opacity: 0.9;
    }

    .star-field--near::before {
      background-image:
        radial-gradient(circle at 8% 47%, rgba(255, 248, 235, 0.9) 0 1.5px, transparent 2.5px, transparent 8px, rgba(255, 209, 209, 0.16) 8.5px, transparent 11px),
        radial-gradient(circle at 27% 7%, rgba(255, 248, 235, 0.82) 0 1.4px, transparent 2.3px),
        radial-gradient(circle at 39% 95%, rgba(221, 211, 255, 0.74) 0 1.2px, transparent 2px),
        radial-gradient(circle at 57% 33%, rgba(255, 248, 235, 0.84) 0 1.5px, transparent 2.4px),
        radial-gradient(circle at 68% 61%, rgba(255, 209, 209, 0.76) 0 1.2px, transparent 2px),
        radial-gradient(circle at 88% 18%, rgba(255, 248, 235, 0.86) 0 1.4px, transparent 2.3px),
        radial-gradient(circle at 97% 73%, rgba(221, 211, 255, 0.7) 0 1.1px, transparent 1.9px);
      animation: starPulseNear 5.6s ease-in-out infinite alternate;
    }

    .nebula {
      position: absolute;
      border-radius: 50%;
      filter: blur(22px);
      opacity: 0.42;
      mix-blend-mode: screen;
      transform: translate3d(
        calc(var(--pointer-x) * 0.1),
        calc(var(--pointer-y) * 0.1),
        0
      );
      transition: transform 900ms cubic-bezier(0.2, 0.75, 0.25, 1);
      will-change: transform;
    }

    .nebula--rose {
      left: 54%;
      top: 27%;
      width: min(62vw, 900px);
      height: min(42vw, 590px);
      background: radial-gradient(ellipse, rgba(188, 104, 132, 0.24), rgba(104, 72, 138, 0.1) 40%, transparent 72%);
      rotate: -18deg;
    }

    .nebula--blue {
      left: 15%;
      top: 53%;
      width: min(58vw, 850px);
      height: min(38vw, 520px);
      background: radial-gradient(ellipse, rgba(62, 116, 141, 0.15), rgba(116, 87, 154, 0.09) 44%, transparent 72%);
      rotate: 23deg;
    }

    .galaxy-system {
      position: absolute;
      left: 64%;
      top: 49%;
      width: min(98vw, 1380px);
      aspect-ratio: 4 / 3;
      transform: translate(-50%, -50%)
        translate3d(
          calc(var(--pointer-x) * 0.72),
          calc(var(--pointer-y) * 0.72),
          0
        );
      transition: transform 900ms cubic-bezier(0.2, 0.75, 0.25, 1);
      will-change: transform;
    }

    .galaxy-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .galaxy-rotor {
      transform-box: view-box;
      transform-origin: 58.5% 51.5%;
      animation: galaxyTurn 58s linear infinite;
    }

    .galaxy-arms {
      transform-box: view-box;
      transform-origin: 58.5% 51.5%;
      animation: galaxyTurn 76s linear infinite reverse;
    }

    .orbit {
      position: absolute;
      left: 58.5%;
      top: 51.5%;
      border: 1px solid rgba(221, 211, 255, 0.18);
      border-radius: 50%;
      transform-origin: center;
      box-shadow: 0 0 18px rgba(184, 169, 232, 0.04);
    }

    .orbit::before {
      content: "";
      position: absolute;
      inset: 9%;
      border: 1px solid rgba(239, 208, 162, 0.07);
      border-radius: inherit;
    }

    .orbit--outer {
      width: 68%;
      aspect-ratio: 2.28;
      margin-left: -34%;
      margin-top: -14.9%;
      animation: orbitOuter 30s linear infinite;
    }

    .orbit--inner {
      width: 46%;
      aspect-ratio: 1.92;
      margin-left: -23%;
      margin-top: -12%;
      border-color: rgba(239, 208, 162, 0.15);
      animation: orbitInner 21s linear infinite reverse;
    }

    .orbiting-light {
      position: absolute;
      left: 50%;
      top: 0;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .orbiting-light::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: inherit;
      background: currentColor;
      opacity: 0.15;
      filter: blur(6px);
    }

    .orbiting-light::after {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: inherit;
      background: currentColor;
      box-shadow:
        0 0 9px currentColor,
        0 0 24px currentColor;
    }

    .orbiting-light--rose {
      color: var(--rose-bright);
    }

    .orbiting-light--lavender {
      color: var(--lavender-bright);
    }

    .topbar {
      position: absolute;
      top: max(1.35rem, env(safe-area-inset-top));
      left: max(1.5rem, calc(env(safe-area-inset-left) + 1rem));
      right: max(1.5rem, calc(env(safe-area-inset-right) + 1rem));
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 0.68rem;
      margin: 0;
      color: var(--cream);
      font-family: var(--serif);
      font-size: 1.08rem;
      font-weight: 500;
      line-height: 1;
    }

    .wordmark-mark {
      position: relative;
      display: grid;
      width: 1.9rem;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid rgba(239, 208, 162, 0.34);
      border-radius: 50%;
      color: var(--rose-bright);
      font-size: 0.72rem;
      font-style: italic;
      box-shadow: inset 0 0 16px rgba(226, 166, 173, 0.08);
    }

    .wordmark-mark::after {
      content: "";
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow:
        0 -12px 0 rgba(239, 208, 162, 0.62),
        11px 5px 0 rgba(221, 211, 255, 0.62),
        -10px 6px 0 rgba(255, 209, 209, 0.62);
    }

    .motion-toggle {
      min-height: 2.55rem;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 0.62rem 0.8rem;
      border: 1px solid rgba(239, 208, 162, 0.24);
      border-radius: 5px;
      background: rgba(5, 9, 20, 0.62);
      color: var(--cream-soft);
      cursor: pointer;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      transition: color 160ms ease, border-color 160ms ease, background-color 160ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .js .motion-toggle {
      display: inline-flex;
    }

    .motion-toggle:hover {
      border-color: rgba(239, 208, 162, 0.5);
      background: rgba(13, 20, 37, 0.82);
      color: var(--cream);
    }

    .motion-toggle:disabled {
      cursor: default;
      opacity: 0.66;
    }

    .motion-toggle:disabled .motion-icon {
      display: none;
    }

    .motion-icon {
      width: 0.9rem;
      height: 0.9rem;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.6;
    }

    .motion-toggle[aria-pressed="false"] .motion-icon--play,
    .motion-toggle[aria-pressed="true"] .motion-icon--pause {
      display: none;
    }

    .motion-label {
      font-size: 0.76rem;
      letter-spacing: 0.04em;
    }

    .hero {
      position: relative;
      z-index: 10;
      display: flex;
      width: min(100%, 1440px);
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding:
        clamp(6.5rem, 12vh, 8rem)
        clamp(1.5rem, 7vw, 7rem)
        clamp(5.5rem, 10vh, 7rem);
      align-items: flex-end;
    }

    .hero-copy {
      width: min(100%, 38rem);
      margin-bottom: clamp(0.25rem, 4vh, 3.75rem);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin: 0 0 1.2rem;
      color: var(--cream-soft);
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      line-height: 1.3;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 1.8rem;
      height: 1px;
      background: linear-gradient(90deg, var(--rose), rgba(226, 166, 173, 0));
    }

    h1 {
      margin: 0;
      color: var(--cream);
      font-family: var(--serif);
      font-size: 7.15rem;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 0.86;
      text-wrap: balance;
      text-shadow:
        0 2px 22px rgba(3, 6, 15, 0.8),
        0 0 44px rgba(226, 166, 173, 0.08);
    }

    h1 span {
      display: block;
      color: var(--rose-bright);
      font-style: italic;
      padding-left: clamp(1rem, 5vw, 4.8rem);
    }

    .lede {
      max-width: 31rem;
      margin: clamp(1.45rem, 3vh, 2rem) 0 0;
      color: var(--cream-soft);
      font-family: var(--serif);
      font-size: 1.24rem;
      line-height: 1.55;
      text-wrap: pretty;
      text-shadow: 0 2px 18px rgba(3, 6, 15, 0.9);
    }

    .coda {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 1.4rem 0 0;
      color: var(--cream-muted);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.17em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .coda::before {
      content: "";
      width: 0.26rem;
      height: 0.26rem;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px rgba(239, 208, 162, 0.72);
      animation: codaPulse 3.6s ease-in-out infinite;
    }

    .footer-note {
      position: absolute;
      right: max(1.5rem, calc(env(safe-area-inset-right) + 1rem));
      bottom: max(1.45rem, calc(env(safe-area-inset-bottom) + 1rem));
      z-index: 14;
      margin: 0;
      color: rgba(216, 201, 185, 0.52);
      font-family: var(--serif);
      font-size: 0.78rem;
      font-style: italic;
      text-align: right;
    }

    .footer-line {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 6;
      height: 24vh;
      pointer-events: none;
      opacity: 0.3;
      background:
        radial-gradient(ellipse at 39% 100%, rgba(226, 166, 173, 0.24), transparent 36%),
        radial-gradient(ellipse at 70% 100%, rgba(184, 169, 232, 0.2), transparent 34%);
      filter: blur(24px);
    }

    .is-paused .galaxy-rotor,
    .is-paused .galaxy-arms,
    .is-paused .orbit,
    .is-paused .star-field::before,
    .is-paused .star-field::after,
    .is-paused .coda::before {
      animation-play-state: paused !important;
    }

    .is-suspended .galaxy-rotor,
    .is-suspended .galaxy-arms,
    .is-suspended .orbit,
    .is-suspended .star-field::before,
    .is-suspended .star-field::after,
    .is-suspended .coda::before {
      animation-play-state: paused !important;
    }

    @keyframes galaxyTurn {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes orbitOuter {
      from {
        transform: rotate(-17deg);
      }
      to {
        transform: rotate(343deg);
      }
    }

    @keyframes orbitInner {
      from {
        transform: rotate(22deg);
      }
      to {
        transform: rotate(382deg);
      }
    }

    @keyframes starDriftFar {
      from {
        transform: translate3d(0, 0, 0);
      }
      to {
        transform: translate3d(2.5%, -2%, 0);
      }
    }

    @keyframes starDriftFarTwo {
      from {
        transform: translate3d(7%, 4%, 0);
      }
      to {
        transform: translate3d(4%, 6%, 0);
      }
    }

    @keyframes starDriftMid {
      from {
        transform: translate3d(-0.8%, 0.5%, 0);
      }
      to {
        transform: translate3d(0.8%, -0.6%, 0);
      }
    }

    @keyframes starPulse {
      0%,
      100% {
        opacity: 0.55;
      }
      50% {
        opacity: 0.88;
      }
    }

    @keyframes starPulseNear {
      from {
        opacity: 0.66;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes codaPulse {
      0%,
      100% {
        opacity: 0.55;
        transform: scale(0.82);
      }
      50% {
        opacity: 1;
        transform: scale(1.12);
      }
    }

    @media (max-width: 760px) {
      .nebula--rose {
        left: 70%;
        top: 33%;
        width: 130vw;
        height: 92vw;
      }

      .nebula--blue {
        left: 18%;

  <script>
    (() => {
      const root = document.documentElement;
      const body = document.body;
      const toggle = document.getElementById("motion-toggle");
      const label = toggle.querySelector(".motion-label");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const finePointer = window.matchMedia("(pointer: fine)");
      let userPaused = false;
      let frame = 0;
      let nextX = 0;
      let nextY = 0;

      function isMotionPaused() {
        return userPaused || reduceMotion.matches;
      }

      function updateControl() {
        const reduced = reduceMotion.matches;
        const paused = isMotionPaused();
        body.classList.toggle("is-paused", paused);
        toggle.disabled = reduced;
        toggle.setAttribute("aria-pressed", String(paused));
        toggle.setAttribute("aria-label", reduced ? "Motion is reduced by your device settings" : paused ? "Resume motion" : "Pause motion");
        label.textContent = reduced ? "Motion reduced" : paused ? "Resume motion" : "Pause motion";
      }

      function setPointerOrigin() {
        nextX = 0;
        nextY = 0;
        root.style.setProperty("--pointer-x", "0px");
        root.style.setProperty("--pointer-y", "0px");
      }

      function schedulePointerFrame() {
        if (frame) return;
        frame = window.requestAnimationFrame(() => {
          frame = 0;
          root.style.setProperty("--pointer-x", `${nextX.toFixed(2)}px`);
          root.style.setProperty("--pointer-y", `${nextY.toFixed(2)}px`);
        });
      }

      toggle.addEventListener("click", () => {
        if (reduceMotion.matches) return;
        userPaused = !userPaused;
        if (userPaused) setPointerOrigin();
        updateControl();
      });

      window.addEventListener("pointermove", (event) => {
        if (isMotionPaused() || !finePointer.matches || document.hidden) return;
        nextX = ((event.clientX / Math.max(window.innerWidth, 1)) - 0.5) * 24;
        nextY = ((event.clientY / Math.max(window.innerHeight, 1)) - 0.5) * 18;
        schedulePointerFrame();
      }, { passive: true });

      document.documentElement.addEventListener("pointerleave", () => {
        if (!isMotionPaused()) setPointerOrigin();
      });

      document.addEventListener("visibilitychange", () => {
        body.classList.toggle("is-suspended", document.hidden);
        if (document.hidden) {
          if (frame) {
            window.cancelAnimationFrame(frame);
            frame = 0;
          }
          setPointerOrigin();
        }
      });

      reduceMotion.addEventListener?.("change", () => {
        if (reduceMotion.matches) setPointerOrigin();
        updateControl();
      });

      updateControl();
    })();
  </script>
